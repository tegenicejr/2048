<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 - Games Club</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <div class="game-container">
    <!-- ヘッダーエリア -->
    <header class="game-header">
      <div class="header-top">
        <a href="https://tegenicejr.github.io/Oh-LOVE-GAMES-CLUBHOUSE/" class="back-link">‹ アソビ大全へ</a>
        <h1 class="title">2048</h1>
      </div>
      <div class="scores-container">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">BEST</span>
          <span id="best-score" class="value">0</span>
        </div>
      </div>
    </header>

    <!-- コントロールボタン -->
    <div class="controls">
      <button id="undo-btn" class="btn">1手戻す</button>
      <button id="ranking-btn" class="btn">ランキング</button>
      <button id="restart-btn" class="btn primary">やり直す</button>
    </div>

    <!-- 4x4 ゲーム盤面 -->
    <div class="board-wrapper">
      <div id="grid-container" class="grid-container">
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
      </div>
      <div id="tile-container" class="tile-container"></div>

      <!-- ゲームオーバー/クリア用モーダル -->
      <div id="game-message" class="game-message">
        <p id="game-message-text">Game Over!</p>
        <div class="lower">
          <button id="retry-button" class="btn primary">もう一度遊ぶ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ランキングモーダル（画面全体オーバーレイ） -->
  <div id="ranking-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>👑 ハイスコア ランキング</h2>
        <button id="close-ranking-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>順位</th>
              <th>スコア</th>
              <th>最大</th>
              <th>日付</th>
            </tr>
          </thead>
          <tbody id="ranking-list">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
        <div id="no-ranking-text" class="no-data">まだ記録がありません</div>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="storage.js"></script>
  <script src="game.js"></script>
</body>
</html>
