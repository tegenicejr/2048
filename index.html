<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>2048 - Games Club</title>
  <link rel="stylesheet" href="style.css?v=confirm_modal">
</head>
<body>

  <div class="game-container">
    <header class="game-header">
      <div class="header-top">
        <a href="https://tegenicejr.github.io/Oh-LOVE-GAMES-CLUBHOUSE/" class="back-link">‹ アソビ大全へ</a>
        <h1 class="title">2048</h1>
      </div>
      <div class="scores-container">
        <div class="score-box">
          <span class="label">SCORE</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">BEST</span>
          <span id="best-score" class="value">0</span>
        </div>
      </div>
    </header>

    <div class="mode-selector">
      <button class="mode-btn" data-size="2">2×2</button>
      <button class="mode-btn active" data-size="4">4×4</button>
      <button class="mode-btn" data-size="5">5×5</button>
      <button class="mode-btn" data-size="6">6×6</button>
    </div>

    <div class="controls">
      <button id="undo-btn" class="btn">1手戻す</button>
      <button id="restart-btn" class="btn primary">やり直す</button>
    </div>

    <div class="board-wrapper">
      <div id="grid-container" class="grid-container"></div>
      <div id="tile-container" class="tile-container"></div>

      <!-- ゲームオーバー / 勝利モーダル -->
      <div id="game-message" class="game-message">
        <p id="game-message-text">Game Over!</p>
        <div class="lower">
          <button id="keep-playing-button" class="btn">続ける</button>
          <button id="retry-button" class="btn primary">もう一度</button>
        </div>
      </div>
    </div>
  </div>

  <!-- やり直し確認モーダル -->
  <div id="confirm-modal" class="confirm-overlay">
    <div class="confirm-card">
      <div class="confirm-icon">⚠️</div>
      <div class="confirm-title">やり直しますか？</div>
      <div class="confirm-desc">現在のスコアと盤面の進行状況がリセットされます。</div>
      <div class="confirm-actions">
        <button id="cancel-restart-btn" class="btn">キャンセル</button>
        <button id="confirm-restart-btn" class="btn primary">やり直す</button>
      </div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="storage.js"></script>
  <script src="game.js?v=confirm_modal"></script>
</body>
</html>
